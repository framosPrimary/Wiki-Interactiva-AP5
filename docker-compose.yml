services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ap5wiki
      POSTGRES_USER: ap5wiki
      POSTGRES_PASSWORD: ap5wiki
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ap5wiki -d ap5wiki"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ap5wiki-db:/var/lib/postgresql/data
  content-permissions:
    image: alpine:3.22
    command: ["chown", "-R", "1001:1001", "/content"]
    volumes:
      - ap5wiki-content:/content
  migrate:
    build:
      context: .
      target: tools
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://ap5wiki:ap5wiki@db:5432/ap5wiki
    depends_on:
      db:
        condition: service_healthy
  ingest:
    build:
      context: .
      target: tools
    command: ["npm", "run", "ingest"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://ap5wiki:ap5wiki@db:5432/ap5wiki
      ARCHITECTURE_SOURCE_PATH: /content/repository/Architecture
      CONTENT_ASSET_PATH: /app/data/content
    volumes:
      - ../Architecture:/content/repository/Architecture:ro
      - ap5wiki-content:/app/data/content
    depends_on:
      migrate:
        condition: service_completed_successfully
      content-permissions:
        condition: service_completed_successfully
  wiki:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://ap5wiki:ap5wiki@db:5432/ap5wiki
      ARCHITECTURE_SOURCE_PATH: /content/repository/Architecture
      CONTENT_ASSET_PATH: /app/data/content
    ports: ["3000:3000"]
    volumes:
      - ../Architecture:/content/repository/Architecture:ro
      - ap5wiki-content:/app/data/content
    depends_on:
      ingest:
        condition: service_completed_successfully
volumes:
  ap5wiki-db:
  ap5wiki-content:
